name: Serenity Hourly Tracker

on:
  # Trigger esclusivo via cron-job.org (workflow_dispatch).
  # Consigliato: ogni ora nelle sedute USA (~13:40-20:40 UTC Lun-Ven),
  # minuti sfasati rispetto agli altri tracker per evitare push simultanei.
  workflow_dispatch:

jobs:
  tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt numpy

      - name: Run serenity_tracker.py
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python serenity_tracker.py

      - name: Commit stato
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add portfolio_serenity.json "Portfolio Serenity Status.md"
          git diff --cached --quiet || git commit -m "chore: serenity tracker [$(date +'%Y-%m-%d %H:%M')]"
          git push || (git pull --rebase origin main && git push)
