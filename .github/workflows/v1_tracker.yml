name: V1 Hourly Tracker

on:
  # Trigger esclusivo via cron-job.org (workflow_dispatch). Il cron interno di
  # GitHub è stato rimosso: inaffidabile e si sovrapponeva a cron-job.org,
  # causando run paralleli che collidevano sul git push.
  # cron-job.org: ogni ora 07:00-20:00 UTC, Lun-Ven.
  workflow_dispatch:

jobs:
  tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt numpy

      - name: Run tracker.py
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tracker.py

      - name: Commit portfolio.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add portfolio.json "Portfolio V1 Status.md"
          git diff --cached --quiet || git commit -m "chore: update v1 portfolio [tracker $(date +'%Y-%m-%d %H:%M')]"
          # push diretto (checkout è già su main aggiornato); il pull --rebase
          # scatta solo nel raro caso di conflitto, evitando il fetch autenticato
          # che falliva con "could not read Username"
          git push || (git pull --rebase origin main && git push)
