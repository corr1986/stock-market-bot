name: Weekly Signals (V1 + V3)

on:
  # Trigger esclusivo via cron-job.org (workflow_dispatch). I cron interni di
  # GitHub (settimanale + keepalive weekend) sono stati rimossi: inaffidabili e
  # causa di run duplicati. cron-job.org chiama questo workflow il Lunedì 05:00
  # UTC; il check interno "is Monday" lascia comunque passare ogni dispatch.
  workflow_dispatch:

jobs:
  weekly_signals:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Check if Monday (or manual dispatch)
        id: check_day
        run: |
          DAY=$(date +%u)
          TRIGGER="${{ github.event_name }}"
          if [ "$DAY" = "1" ] || [ "$TRIGGER" = "workflow_dispatch" ]; then
            echo "run_signals=true" >> $GITHUB_OUTPUT
          else
            echo "run_signals=false" >> $GITHUB_OUTPUT
          fi

      # ── KEEPALIVE (weekend / giorni non-lunedì) ─────────────────────────
      - name: Keepalive commit
        if: steps.check_day.outputs.run_signals == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .keepalive
          git add .keepalive
          git commit -m "chore: keepalive [$(date +'%Y-%m-%d')]"
          git push

      # ── SEGNALI LUNEDÌ ──────────────────────────────────────────────────
      - name: Setup Python
        if: steps.check_day.outputs.run_signals == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: steps.check_day.outputs.run_signals == 'true'
        run: pip install -r requirements.txt numpy

      # V1 prima, poi V3 — sequenziali, niente conflitti push
      - name: Run V1 main.py
        if: steps.check_day.outputs.run_signals == 'true'
        env:
          GROQ_API_KEY:     ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit V1 portfolio.json
        if: steps.check_day.outputs.run_signals == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add portfolio.json
          git diff --cached --quiet || git commit -m "chore: update v1 portfolio [weekly $(date +'%Y-%m-%d')]"
          git pull --rebase origin main
          git push

      - name: Run V3 main_v3.py
        if: steps.check_day.outputs.run_signals == 'true'
        env:
          GROQ_API_KEY:     ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main_v3.py

      - name: Commit V3 portfolio_v3.json
        if: steps.check_day.outputs.run_signals == 'true'
        run: |
          git add portfolio_v3.json
          git diff --cached --quiet || git commit -m "chore: update portfolio_v3 [weekly $(date +'%Y-%m-%d')]"
          git pull --rebase origin main
          git push
