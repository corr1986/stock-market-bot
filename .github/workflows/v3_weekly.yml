name: V3 Weekly Signal Selection

on:
  schedule:
    # Ogni giorno lavorativo 05:30 UTC = 12:30 Vietnam (UTC+7)
    # Gira 5x/settimana per tenere GitHub attivo — elabora solo il lunedì
    - cron: '30 5 * * 1-5'
  workflow_dispatch:  # permette run manuale dal browser

jobs:
  weekly_signals:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check if Monday
        id: check_day
        run: echo "is_monday=$([ $(date +%u) -eq 1 ] && echo true || echo false)" >> $GITHUB_OUTPUT

      - name: Checkout repo
        if: steps.check_day.outputs.is_monday == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Python
        if: steps.check_day.outputs.is_monday == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: steps.check_day.outputs.is_monday == 'true' || github.event_name == 'workflow_dispatch'
        run: pip install yfinance pandas numpy ta groq anthropic python-dotenv requests

      - name: Run main_v3.py
        if: steps.check_day.outputs.is_monday == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GROQ_API_KEY:     ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main_v3.py

      - name: Commit portfolio_v3.json
        if: steps.check_day.outputs.is_monday == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add portfolio_v3.json
          git diff --cached --quiet || git commit -m "chore: update portfolio_v3 [weekly $(date +'%Y-%m-%d')]"
          git pull --rebase origin main
          git push
