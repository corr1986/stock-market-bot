name: Serenity Daily Signals

on:
  # Trigger esclusivo via cron-job.org (workflow_dispatch), come gli altri bot.
  # Consigliato: 1x/giorno pre-apertura USA (~13:00 UTC Lun-Ven).
  workflow_dispatch:

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt numpy groq

      - name: Run serenity_daily.py
        env:
          GROQ_API_KEY:     ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python serenity_daily.py

      - name: Commit stato
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add portfolio_serenity.json serenity_stance_cache.json "Portfolio Serenity Status.md"
          git diff --cached --quiet || git commit -m "chore: serenity daily [$(date +'%Y-%m-%d %H:%M')]"
          git push || (git pull --rebase origin main && git push)
